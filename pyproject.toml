[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dikwp-qingyuan"
version = "27.0.0"
description = "DIKWP Active Cognitive Immune and Reality Repair research system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Yucong Duan"}]
dependencies = []
keywords = ["DIKWP", "cognitive immunity", "misinformation", "context repair", "attention safety"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[project.scripts]
qingyuan27 = "dikwp_qingyuan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
