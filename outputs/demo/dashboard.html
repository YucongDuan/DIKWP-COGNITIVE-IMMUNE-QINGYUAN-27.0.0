  const templates = [];
  const escapePattern = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  for (const [source, target] of dictionary) {
    const a = source.match(numeric) || [], b = target.match(numeric) || [];
    if (!a.length || a.length > 12 || a.length !== b.length || !a.every((v, i) => v.replace(/,/g, '') === b[i].replace(/,/g, ''))) continue;
    const parts = source.split(numeric);
    templates.push({pattern: new RegExp('^' + parts.map(escapePattern).join('(\\d[\\d,]*(?:\\.\\d+)?)') + '$'), parts: target.split(numeric)});
  }
  const textState = new WeakMap();
  const attributeState = new WeakMap();
  const attributes = ['title', 'placeholder', 'aria-label', 'alt', 'label'];
  const excluded = 'script,style,pre,code,textarea,[contenteditable],[data-source-language],[data-project-creator]';
  let language = 'en';
  const originalTitle = document.title;

  function translate(value) {
    const key = value.trim().replace(/\s+/g, ' ');
    let translated = dictionary.get(key);
    if (translated === undefined && /[\u3400-\u9fff]/.test(key)) {
      for (const template of templates) {
        const match = key.match(template.pattern);
        if (!match) continue;
        translated = template.parts.map((part, i) => part + (match[i + 1] || '')).join('');
        break;
      }
    }
    if (translated === undefined) return value;
    const leading = value.match(/^\s*/)[0];
    const trailing = value.match(/\s*$/)[0];
    return leading + translated + trailing;
  }

  function updateText(node) {
    const parent = node.parentElement;
    if (!parent || parent.closest(excluded)) return;
    let saved = textState.get(node);
    const current = node.nodeValue;
    if (!saved || current !== saved.rendered) saved = { original: current, rendered: current };
    const next = language === 'en' ? translate(saved.original) : saved.original;
    if (next !== current) {
      // Translating an option label must not change the value used by the application.
      if (parent.tagName === 'OPTION' && !parent.hasAttribute('value')) parent.setAttribute('value', parent.textContent);
      node.nodeValue = next;
    }
    saved.rendered = next;
    textState.set(node, saved);
  }

  function updateAttributes(element) {
    if (!element || element.closest(excluded)) return;
    let saved = attributeState.get(element);
    if (!saved) { saved = new Map(); attributeState.set(element, saved); }
    for (const name of attributes) {
      if (!element.hasAttribute(name)) continue;
      // The label attribute is an interface label on these elements only.
      if (name === 'label' && !['OPTION', 'OPTGROUP', 'TRACK'].includes(element.tagName)) continue;
      const current = element.getAttribute(name);
      let prior = saved.get(name);
      if (!prior || current !== prior.rendered) prior = { original: current, rendered: current };
      const next = language === 'en' ? translate(prior.original) : prior.original;
      if (next !== current) element.setAttribute(name, next);
      prior.rendered = next; saved.set(name, prior);
    }
  }

  function visit(root) {
    if (root.nodeType === Node.TEXT_NODE) { updateText(root); return; }
    if (root.nodeType !== Node.ELEMENT_NODE || root.closest(excluded)) return;
    updateAttributes(root);
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) updateText(walker.currentNode);
    for (const element of root.querySelectorAll('[title],[placeholder],[aria-label],[alt],[label]')) updateAttributes(element);
  }

  function setLanguage(next) {
    language = next === 'zh' ? 'zh' : 'en';
    document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
    document.title = language === 'en' ? translate(originalTitle) : originalTitle;
    visit(document.body);
  }

  function start() {
    const select = config.nativeSelect ? document.querySelector(config.nativeSelect) : null;
    const button = config.nativeButton ? document.querySelector(config.nativeButton) : null;
    if (select) language = select.value === 'zh' ? 'zh' : 'en';
    else if (config.storageKey) {
      try { language = localStorage.getItem(config.storageKey) === 'zh' ? 'zh' : 'en'; } catch (_) { language = 'en'; }
    }
    setLanguage(language);
    if (select) select.addEventListener('change', () => setLanguage(select.value));
    if (button) button.addEventListener('click', () => setLanguage(language === 'en' ? 'zh' : 'en'));
    const observer = new MutationObserver(records => {
      for (const record of records) {
        if (record.type === 'characterData') updateText(record.target);
        else if (record.type === 'attributes') updateAttributes(record.target);
        else for (const node of record.addedNodes) visit(node);
      }
    });
    observer.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: attributes });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
  else start();
})();

</script>
</body></html>
